name: CI

on:
  push:
    branches: [ main, 'phase1/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build (non-interactive)
        env:
          CI: true
          NEXT_SKIP_ESLINT: 1
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # @playwright/test requires Node 20+; the build job stays on 18.x
        # to match the app's own runtime target, this job only runs tests.
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (hero -> CTA journey + accessibility)
        env:
          CI: true
        run: npm run test:e2e
